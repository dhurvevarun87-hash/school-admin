<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Gallery Manager | Sree Narayana Vidhyalaya</title>

    <link rel="stylesheet" href="admin.css">
</head>

<body>

    <div class="gallery-page">

        <!-- HEADER -->
        <header class="gallery-header">

            <div>
                <h1>📸 Gallery Manager</h1>

                <p>
                    Sree Narayana Vidhyalaya
                </p>
            </div>

            <div class="header-actions">

                <a
                    href="dashboard.html"
                    class="back-dashboard"
                >
                    ← Dashboard
                </a>

                <button id="logoutBtn">
                    Logout
                </button>

            </div>

        </header>


        <!-- MAIN -->
        <main class="gallery-container">


            <!-- UPLOAD -->
            <section class="upload-card">

                <div class="upload-title">

                    <div class="upload-icon">
                        📤
                    </div>

                    <div>

                        <h2>
                            Upload New Photo
                        </h2>

                        <p>
                            Add photos to the school gallery.
                        </p>

                    </div>

                </div>


                <form id="uploadForm">

                    <div class="form-group">

                        <label for="photoTitle">
                            Photo Title
                        </label>

                        <input
                            type="text"
                            id="photoTitle"
                            placeholder="e.g. Annual Function 2026"
                            maxlength="100"
                            required
                        >

                    </div>


                    <div class="form-group">

                        <label for="photoFile">
                            Select Photo
                        </label>

                        <input
                            type="file"
                            id="photoFile"
                            accept="image/jpeg,image/png,image/webp"
                            required
                        >

                        <small>
                            JPG, PNG or WebP • Maximum 5MB
                        </small>

                    </div>


                    <!-- PREVIEW -->
                    <div
                        id="imagePreview"
                        class="image-preview"
                    >
                        <span>
                            Image preview will appear here
                        </span>
                    </div>


                    <button
                        type="submit"
                        id="uploadBtn"
                    >
                        ⬆️ Upload Photo
                    </button>


                    <div
                        id="uploadMessage"
                        class="upload-message"
                    ></div>

                </form>

            </section>


            <!-- GALLERY -->
            <section class="gallery-card">

                <div class="section-heading">

                    <div>

                        <h2>
                            Uploaded Photos
                        </h2>

                        <p>
                            Manage photos currently stored
                            in the school gallery.
                        </p>

                    </div>


                    <button
                        id="refreshBtn"
                        class="refresh-btn"
                        type="button"
                    >
                        ↻ Refresh
                    </button>

                </div>


                <div
                    id="galleryGrid"
                    class="gallery-grid"
                >

                    <div class="loading">
                        Loading photos...
                    </div>

                </div>

            </section>

        </main>

    </div>


    <!-- SUPABASE -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>


    <script>

        // =====================================================
        // SUPABASE CONFIG
        // =====================================================

        const SUPABASE_URL =
            "https://pnyzlbbdhbdunopsdzcx.supabase.co";

        const SUPABASE_KEY =
            "sb_publishable_2pmABySR4qtu8RYiPzb7UQ_nWm9-gKX";


        const supabaseClient =
            window.supabase.createClient(
                SUPABASE_URL,
                SUPABASE_KEY
            );


        // =====================================================
        // ELEMENTS
        // =====================================================

        const uploadForm =
            document.getElementById("uploadForm");

        const photoFile =
            document.getElementById("photoFile");

        const photoTitle =
            document.getElementById("photoTitle");

        const imagePreview =
            document.getElementById("imagePreview");

        const uploadBtn =
            document.getElementById("uploadBtn");

        const uploadMessage =
            document.getElementById("uploadMessage");

        const galleryGrid =
            document.getElementById("galleryGrid");

        const refreshBtn =
            document.getElementById("refreshBtn");

        const logoutBtn =
            document.getElementById("logoutBtn");


        // =====================================================
        // CHECK LOGIN
        // =====================================================

        async function checkLogin() {

            const {
                data: {
                    session
                }
            } =
                await supabaseClient.auth.getSession();


            if (!session) {

                window.location.href =
                    "login.html";

                return false;
            }


            return true;
        }


        // =====================================================
        // IMAGE PREVIEW
        // =====================================================

        photoFile.addEventListener(
            "change",
            function () {

                const file =
                    this.files[0];


                if (!file) {

                    imagePreview.innerHTML =
                        "<span>Image preview will appear here</span>";

                    return;
                }


                if (!file.type.startsWith("image/")) {

                    imagePreview.innerHTML =
                        "<span>❌ Please select an image.</span>";

                    this.value = "";

                    return;
                }


                if (file.size > 5 * 1024 * 1024) {

                    imagePreview.innerHTML =
                        "<span>❌ Image must be under 5MB.</span>";

                    this.value = "";

                    return;
                }


                const reader =
                    new FileReader();


                reader.onload =
                    function (event) {

                        imagePreview.innerHTML = `
                            <img
                                src="${event.target.result}"
                                alt="Preview"
                            >
                        `;

                    };


                reader.readAsDataURL(file);

            }
        );


        // =====================================================
        // UPLOAD PHOTO
        // =====================================================

        uploadForm.addEventListener(
            "submit",
            async function (event) {

                event.preventDefault();


                const loggedIn =
                    await checkLogin();


                if (!loggedIn) return;


                const file =
                    photoFile.files[0];

                const title =
                    photoTitle.value.trim();


                if (!file) {

                    showMessage(
                        "Please select a photo.",
                        "error"
                    );

                    return;
                }


                if (!title) {

                    showMessage(
                        "Please enter a photo title.",
                        "error"
                    );

                    return;
                }


                if (file.size > 5 * 1024 * 1024) {

                    showMessage(
                        "Photo must be under 5MB.",
                        "error"
                    );

                    return;
                }


                uploadBtn.disabled = true;

                uploadBtn.textContent =
                    "Uploading...";


                let fileName = null;


                try {

                    // =================================================
                    // CREATE UNIQUE FILE NAME
                    // =================================================

                    const extension =
                        file.name
                            .split(".")
                            .pop()
                            .toLowerCase();


                    fileName =
                        Date.now() +
                        "-" +
                        Math.random()
                            .toString(36)
                            .substring(2, 8) +
                        "." +
                        extension;


                    // =================================================
                    // UPLOAD TO STORAGE
                    // =================================================

                    const {
                        error: uploadError
                    } =
                        await supabaseClient
                            .storage
                            .from("school-gallery")
                            .upload(
                                fileName,
                                file,
                                {
                                    cacheControl: "3600",
                                    upsert: false,
                                    contentType: file.type
                                }
                            );


                    if (uploadError) {

                        throw uploadError;
                    }


                    // =================================================
                    // GET PUBLIC IMAGE URL
                    // =================================================

                    const {
                        data: publicData
                    } =
                        supabaseClient
                            .storage
                            .from("school-gallery")
                            .getPublicUrl(
                                fileName
                            );


                    const imageUrl =
                        publicData.publicUrl;


                    // =================================================
                    // SAVE PHOTO INFO TO DATABASE
                    // gallery TABLE
                    // =================================================

                    const {
                        error: databaseError
                    } =
                        await supabaseClient
                            .from("gallery")
                            .insert([
                                {
                                    title: title,
                                    image_url: imageUrl,
                                    file_name: fileName
                                }
                            ]);


                    // If database insert fails,
                    // remove uploaded image from Storage.

                    if (databaseError) {

                        await supabaseClient
                            .storage
                            .from("school-gallery")
                            .remove([
                                fileName
                            ]);

                        throw databaseError;
                    }


                    // =================================================
                    // SUCCESS
                    // =================================================

                    showMessage(
                        "✅ Photo uploaded successfully!",
                        "success"
                    );


                    uploadForm.reset();


                    imagePreview.innerHTML =
                        "<span>Image preview will appear here</span>";


                    // Reload from DATABASE

                    await loadGallery();


                } catch (error) {

                    console.error(
                        "Upload error:",
                        error
                    );


                    showMessage(
                        "❌ Upload failed: " +
                        error.message,
                        "error"
                    );

                }


                uploadBtn.disabled = false;

                uploadBtn.textContent =
                    "⬆️ Upload Photo";

            }
        );


        // =====================================================
        // LOAD GALLERY FROM DATABASE
        // =====================================================

        async function loadGallery() {

            galleryGrid.innerHTML = `
                <div class="loading">
                    Loading photos...
                </div>
            `;


            try {

                const {
                    data,
                    error
                } =
                    await supabaseClient
                        .from("gallery")
                        .select(
                            "id, title, image_url, file_name, created_at"
                        )
                        .order(
                            "created_at",
                            {
                                ascending: false
                            }
                        );


                if (error) {

                    throw error;
                }


                if (!data || data.length === 0) {

                    galleryGrid.innerHTML = `
                        <div class="empty-gallery">

                            <div>🖼️</div>

                            <h3>
                                No photos yet
                            </h3>

                            <p>
                                Upload your first school photo above.
                            </p>

                        </div>
                    `;

                    return;
                }


                galleryGrid.innerHTML =
                    data
                        .map(
                            photo => {

                                const date =
                                    new Date(
                                        photo.created_at
                                    )
                                        .toLocaleDateString(
                                            "en-IN",
                                            {
                                                day: "numeric",
                                                month: "short",
                                                year: "numeric"
                                            }
                                        );


                                return `

                                    <article class="photo-item">

                                        <div class="photo-image">

                                            <img
                                                src="${escapeHtml(photo.image_url)}"
                                                alt="${escapeHtml(photo.title)}"
                                                loading="lazy"
                                            >

                                        </div>


                                        <div class="photo-info">

                                            <h3>
                                                ${escapeHtml(photo.title)}
                                            </h3>


                                            <p>
                                                ${date}
                                            </p>


                                            <button
                                                class="delete-btn"
                                                onclick="deletePhoto(
                                                    '${photo.id}',
                                                    '${escapeJs(photo.file_name)}'
                                                )"
                                            >
                                                🗑️ Delete
                                            </button>

                                        </div>

                                    </article>

                                `;

                            }
                        )
                        .join("");


            } catch (error) {

                console.error(
                    "Gallery loading error:",
                    error
                );


                galleryGrid.innerHTML = `
                    <div class="empty-gallery">

                        <div>⚠️</div>

                        <h3>
                            Could not load gallery
                        </h3>

                        <p>
                            ${escapeHtml(error.message)}
                        </p>

                    </div>
                `;

            }

        }


        // =====================================================
        // DELETE PHOTO
        // =====================================================

        async function deletePhoto(
            photoId,
            fileName
        ) {

            const confirmed =
                confirm(
                    "Delete this photo?"
                );


            if (!confirmed) return;


            try {

                // =================================================
                // DELETE FROM STORAGE
                // =================================================

                const {
                    error: storageError
                } =
                    await supabaseClient
                        .storage
                        .from("school-gallery")
                        .remove([
                            fileName
                        ]);


                if (storageError) {

                    throw storageError;
                }


                // =================================================
                // DELETE FROM DATABASE
                // =================================================

                const {
                    error: databaseError
                } =
                    await supabaseClient
                        .from("gallery")
                        .delete()
                        .eq(
                            "id",
                            photoId
                        );


                if (databaseError) {

                    throw databaseError;
                }


                await loadGallery();


                showMessage(
                    "✅ Photo deleted successfully.",
                    "success"
                );


            } catch (error) {

                console.error(
                    "Delete error:",
                    error
                );


                alert(
                    "Could not delete photo: " +
                    error.message
                );

            }

        }


        // =====================================================
        // REFRESH
        // =====================================================

        refreshBtn.addEventListener(
            "click",
            loadGallery
        );


        // =====================================================
        // LOGOUT
        // =====================================================

        logoutBtn.addEventListener(
            "click",
            async function () {

                await supabaseClient.auth.signOut();

                window.location.href =
                    "login.html";

            }
        );


        // =====================================================
        // MESSAGE
        // =====================================================

        function showMessage(
            message,
            type
        ) {

            uploadMessage.textContent =
                message;


            uploadMessage.className =
                "upload-message " +
                type;


            setTimeout(
                () => {

                    uploadMessage.textContent =
                        "";

                    uploadMessage.className =
                        "upload-message";

                },
                4000
            );

        }


        // =====================================================
        // HTML ESCAPE
        // =====================================================

        function escapeHtml(text) {

            const div =
                document.createElement("div");


            div.textContent =
                text ?? "";


            return div.innerHTML;

        }


        // =====================================================
        // JAVASCRIPT STRING ESCAPE
        // =====================================================

        function escapeJs(text) {

            return String(
                text ?? ""
            )
                .replace(
                    /\\/g,
                    "\\\\"
                )
                .replace(
                    /'/g,
                    "\\'"
                )
                .replace(
                    /"/g,
                    "&quot;"
                );

        }


        // =====================================================
        // START
        // =====================================================

        (async function () {

            const loggedIn =
                await checkLogin();


            if (loggedIn) {

                await loadGallery();

            }

        })();

    </script>

</body>
</html>
